name = "ai-builder"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "BuilderAgent"
class_name = "BuilderAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BuilderAgent"]

[vars]
APP_ENV = "development"

# Secrets — set via: wrangler secret put KEY
# ANTHROPIC_API_KEY   ← set this to use Claude (claude-sonnet-4-6); takes priority over OpenAI
# OPENAI_API_KEY      ← fallback when ANTHROPIC_API_KEY is not set
# UPSTASH_URL
# UPSTASH_TOKEN
# BRAINTRUST_API_KEY
