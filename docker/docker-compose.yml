services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web/src:/app/apps/web/src
      - ../packages:/app/packages
    env_file:
      - ../.env.local
    environment:
      - VITE_AGENT_URL=ws://worker:8787
    depends_on:
      - worker

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    ports:
      - "8787:8787"
    volumes:
      - ../apps/worker/src:/app/apps/worker/src
      - ../packages:/app/packages
    env_file:
      - ../.env.local
